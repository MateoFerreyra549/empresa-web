<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | Solvex</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="header">
    <nav class="nav">
      <a href="index.html" class="logo">
        <img src="img/logo-icono.png" alt="Logo de Solvex">
        <span class="logo-texto"><span class="azul">SOLV</span>EX</span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Abrir menú">☰</button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="contacto.html" class="activo">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="page-banner">
      <div class="contenedor"><h1>Contacto</h1></div>
    </section>

    <section class="seccion">
      <div class="contenedor">
        <form id="formContacto" class="formulario" novalidate>
          <div id="resultado"></div>

          <div class="campo">
            <label for="nombre">Nombre *</label>
            <input type="text" id="nombre" name="nombre">
            <div class="error-campo"></div>
          </div>

          <div class="campo">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email">
            <div class="error-campo"></div>
          </div>

          <div class="campo">
            <label for="telefono">Teléfono (opcional)</label>
            <input type="tel" id="telefono" name="telefono">
            <div class="error-campo"></div>
          </div>

          <div class="campo">
            <label for="id_servicio">Servicio de interés (opcional)</label>
            <select id="id_servicio" name="id_servicio">
              <option value="">Seleccioná un servicio</option>
            </select>
          </div>

          <div class="campo">
            <label for="asunto">Asunto *</label>
            <input type="text" id="asunto" name="asunto">
            <div class="error-campo"></div>
          </div>

          <div class="campo">
            <label for="mensaje">Mensaje * (mínimo 10 caracteres)</label>
            <textarea id="mensaje" name="mensaje"></textarea>
            <div class="error-campo"></div>
          </div>

          <button type="submit" class="btn btn-primario" id="btnEnviar">Enviar consulta</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Solvex. Todos los derechos reservados.</p>
    <p><a href="admin/login.html">Acceso administración</a></p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
