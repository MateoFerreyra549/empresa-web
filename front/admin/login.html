<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso | Panel Solvex</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="login-page">

  <main class="login-box">
    <img src="../img/logo-completo.png" alt="Logo de Solvex" class="login-logo">
    <h1>Panel Solvex</h1>
    <div id="mensaje"></div>

    <form id="formLogin" novalidate>
      <div class="campo">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" autocomplete="username">
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primario" style="width:100%">Ingresar</button>
    </form>

    <a href="../index.html" class="volver">← Volver al sitio</a>
  </main>

  <script src="../js/login.js"></script>
</body>
</html>
